name: Deploy sylvain.sh

on:
    push:
        branches: ["master"]

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Pages
              uses: actions/configure-pages@v6

            - name: Install dependencies
              run: npm ci

            - name: Build with Next.js
              run: npm run build

            - name: Generate the CV PDF
              run: npm run cv

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
